/* ============================================================
   PART 4/5 — THIRD PERSON CAMERA
   PLAYER FOLLOW CAMERA
   ============================================================ */

class ThirdPersonCameraController {
  constructor(app, player, options = {}) {
    this.app = app;
    this.camera = app.camera;
    this.player = player;

    this.distance = options.distance || 8;
    this.height = options.height || 5;
    this.lookHeight = options.lookHeight || 1.2;

    this.smoothness = options.smoothness || 5;

    this.offset = new THREE.Vector3();
    this.targetPosition = new THREE.Vector3();
    this.lookTarget = new THREE.Vector3();

    this.enabled = true;
  }

  setPlayer(player) {
    if (player) {
      this.player = player;
    }
  }

  update(deltaTime) {
    if (!this.enabled || !this.camera || !this.player) {
      return;
    }

    const root = this.player.root;

    if (!root) return;

    const position = root.position;

    const direction = this.player.direction || 0;

    const behindX = -Math.sin(direction);
    const behindZ = -Math.cos(direction);

    this.targetPosition.set(
      position.x + behindX * this.distance,
      position.y + this.height,
      position.z + behindZ * this.distance
    );

    this.lookTarget.set(
      position.x,
      position.y + this.lookHeight,
      position.z
    );

    const alpha = 1 - Math.exp(
      -this.smoothness * Math.max(0, deltaTime)
    );

    this.camera.position.lerp(
      this.targetPosition,
      alpha
    );

    this.camera.lookAt(this.lookTarget);
  }

  dispose() {
    this.enabled = false;
  }
}

/* ============================================================
   MATCH PLAYER CONTROLLER MANAGER
   ============================================================ */

class HumanControllerManager {
  constructor(app) {
    this.app = app;

    this.controller = null;
    this.cameraController = null;

    this.enabled = false;
  }

  create(player) {
    if (!player) {
      console.warn("No player selected for human control.");
      return null;
    }

    if (this.controller) {
      this.dispose();
    }

    this.controller = new HumanPlayerController(
      this.app,
      player
    );

    this.controller.installMobileControls();

    this.cameraController =
      new ThirdPersonCameraController(
        this.app,
        player,
        {
          distance: 8,
          height: 5,
          lookHeight: 1.2,
          smoothness: 5
        }
      );

    this.enabled = true;

    return this.controller;
  }

  getControlledPlayer() {
    return this.controller
      ? this.controller.player
      : null;
  }

  update(deltaTime) {
    if (!this.enabled || !this.controller) {
      return;
    }

    this.controller.update(deltaTime);

    if (this.cameraController) {
      this.cameraController.setPlayer(
        this.controller.player
      );

      this.cameraController.update(deltaTime);
    }
  }

  switchPlayer() {
    if (!this.controller) return;

    this.controller.switchPlayer();

    if (this.cameraController) {
      this.cameraController.setPlayer(
        this.controller.player
      );
    }
  }

  dispose() {
    if (this.controller) {
      this.controller.disposeMobileControls();

      if (typeof this.controller.dispose === "function") {
        this.controller.dispose();
      }

      this.controller = null;
    }

    if (this.cameraController) {
      this.cameraController.dispose();
      this.cameraController = null;
    }

    this.enabled = false;
  }
}

/* ============================================================
   INSTALL HUMAN CONTROL INTO FOOTBALL APP
   ============================================================ */

function installHumanControl(app, player) {
  if (!app || !player) {
    console.error(
      "Human control requires an app and a player."
    );

    return null;
  }

  if (app.humanControllerManager) {
    app.humanControllerManager.dispose();
  }

  const manager = new HumanControllerManager(app);

  app.humanControllerManager = manager;

  manager.create(player);

  return manager;
}

/* ============================================================
   APP UPDATE INTEGRATION
   ============================================================ */

function connectHumanControlToUpdate(app) {
  if (!app || app.__humanUpdateConnected) return;

  const previousUpdate = app.update;

  app.update = function(deltaTime) {
    if (typeof previousUpdate === "function") {
      previousUpdate.call(this, deltaTime);
    }

    if (this.humanControllerManager) {
      this.humanControllerManager.update(deltaTime);
    }
  };

  app.__humanUpdateConnected = true;
}

/* ============================================================
   MOBILE DEVICE DETECTION
   ============================================================ */

function isFootballMobileDevice() {
  if (typeof navigator === "undefined") {
    return false;
  }

  return (
    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 &&
      window.matchMedia("(pointer: coarse)").matches)
  );
}

/* ============================================================
   RESPONSIVE CONTROL VISIBILITY
   ============================================================ */

function configureFootballControls(app) {
  if (!app || !app.humanControllerManager) return;

  const manager = app.humanControllerManager;

  if (!manager.controller) return;

  const mobile = isFootballMobileDevice();

  if (manager.controller.mobileControls) {
    manager.controller.mobileControls.setVisible(mobile);
  }
}

/* ============================================================
   PART 4 INITIALIZATION HELPER
   ============================================================ */

function initializeHumanFootballMode(app, player) {
  const manager = installHumanControl(app, player);

  if (!manager) return null;

  connectHumanControlToUpdate(app);

  configureFootballControls(app);

  window.addEventListener(
    "resize",
    () => configureFootballControls(app)
  );

  return manager;
}

