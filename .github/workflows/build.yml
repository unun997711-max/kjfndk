class FootballMatchRuntime 
/* ============================================================
   PART 4/5 — PLAYER CONTROLLER
   MOVEMENT, SPRINT, DRIBBLING AND PLAYER SWITCHING
   ============================================================ */

const PLAYER_CONTROL_CONFIG = Object.freeze({
  walkSpeed: 5.2,
  sprintSpeed: 8.5,
  acceleration: 13,
  deceleration: 17,
  turnSpeed: 10,
  dribbleDistance: 1.15,
  ballControlDistance: 1.8,
  sprintStaminaDrain: 15,
  staminaRecovery: 8,
  tackleRange: 1.4,
  switchRange: 25
});

class PlayerInput {
  constructor() {
    this.keys = new Set();

    this.axisX = 0;
    this.axisZ = 0;

    this.sprint = false;
    this.pass = false;
    this.shoot = false;
    this.tackle = false;

    this.enabled = true;

    this.bindKeyboard();
  }

  bindKeyboard() {
    if (typeof window === "undefined") return;

    window.addEventListener("keydown", event => {
      this.keys.add(event.code);
    });

    window.addEventListener("keyup", event => {
      this.keys.delete(event.code);
    });

    window.addEventListener("blur", () => {
      this.keys.clear();
      this.resetActions();
    });
  }

  resetActions() {
    this.sprint = false;
    this.pass = false;
    this.shoot = false;
    this.tackle = false;
  }

  update() {
    if (!this.enabled) return;

    this.axisX = 0;
    this.axisZ = 0;

    if (
      this.keys.has("KeyA") ||
      this.keys.has("ArrowLeft")
    ) {
      this.axisX -= 1;
    }

    if (
      this.keys.has("KeyD") ||
      this.keys.has("ArrowRight")
    ) {
      this.axisX += 1;
    }

    if (
      this.keys.has("KeyW") ||
      this.keys.has("ArrowUp")
    ) {
      this.axisZ -= 1;
    }

    if (
      this.keys.has("KeyS") ||
      this.keys.has("ArrowDown")
    ) {
      this.axisZ += 1;
    }

    this.sprint =
      this.keys.has("ShiftLeft") ||
      this.keys.has("ShiftRight");

    this.pass = this.keys.has("KeyJ");
    this.shoot = this.keys.has("KeyK");
    this.tackle = this.keys.has("Space");

    const length = Math.hypot(
      this.axisX,
      this.axisZ
    );

    if (length > 1) {
      this.axisX /= length;
      this.axisZ /= length;
    }
  }

  getMovement() {
    return {
      x: this.axisX,
      z: this.axisZ
    };
  }
}

/* ============================================================
   PLAYER CONTROL SYSTEM
   ============================================================ */

class HumanPlayerController {
  constructor(app, player) {
    this.app = app;
    this.player = player;

    this.input = new PlayerInput();

    this.stamina = 100;
    this.kickCooldown = 0;
    this.tackleCooldown = 0;

    this.direction = V3(0, 0, -1);

    this.enabled = true;
  }

  update(dt) {
    if (!this.enabled || !this.player) return;

    this.input.update();

    this.kickCooldown = Math.max(
      0,
      this.kickCooldown - dt
    );

    this.tackleCooldown = Math.max(
      0,
      this.tackleCooldown - dt
    );

    this.updateMovement(dt);
    this.updateBallControl(dt);
    this.updateActions(dt);
  }

  updateMovement(dt) {
    const movement = this.input.getMovement();

    const moving =
      Math.abs(movement.x) > 0.01 ||
      Math.abs(movement.z) > 0.01;

    let speed = PLAYER_CONTROL_CONFIG.walkSpeed;

    if (
      this.input.sprint &&
      this.stamina > 1 &&
      moving
    ) {
      speed = PLAYER_CONTROL_CONFIG.sprintSpeed;

      this.stamina = Math.max(
        0,
        this.stamina -
        PLAYER_CONTROL_CONFIG.sprintStaminaDrain * dt
      );
    } else {
      this.stamina = Math.min(
        100,
        this.stamina +
        PLAYER_CONTROL_CONFIG.staminaRecovery * dt
      );
    }

    const p = this.player;

    const desiredX = movement.x * speed;
    const desiredZ = movement.z * speed;

    p.velocity.x = damp(
      p.velocity.x,
      desiredX,
      PLAYER_CONTROL_CONFIG.acceleration,
      dt
    );

    p.velocity.z = damp(
      p.velocity.z,
      desiredZ,
      PLAYER_CONTROL_CONFIG.acceleration,
      dt
    );

    p.root.position.x += p.velocity.x * dt;
    p.root.position.z += p.velocity.z * dt;

    p.root.position.x = clamp(
      p.root.position.x,
      -SETTINGS.fieldWidth / 2 + 0.8,
      SETTINGS.fieldWidth / 2 - 0.8
    );

    p.root.position.z = clamp(
      p.root.position.z,
      -SETTINGS.fieldLength / 2 + 0.8,
      SETTINGS.fieldLength / 2 - 0.8
    );

    if (moving) {
      const yaw = Math.atan2(
        -movement.x,
        -movement.z
      );

      p.root.rotation.y = dampAngle(
        p.root.rotation.y,
        yaw,
        PLAYER_CONTROL_CONFIG.turnSpeed,
        dt
      );

      this.direction.set(
        movement.x,
        0,
        movement.z
      ).normalize();
    }

    this.animatePlayer(dt, moving);
  }

  animatePlayer(dt, moving) {
    const p = this.player;

    const speed = Math.hypot(
      p.velocity.x,
      p.velocity.z
    );

    p.animationTime += dt * (
      moving ? 11 : 2
    );

    const swing = moving
      ? Math.sin(p.animationTime) *
        Math.min(0.65, speed * 0.1)
      : 0;

    if (p.legs && p.legs.length >= 2) {
      p.legs[0].rotation.x = swing;
      p.legs[1].rotation.x = -swing;
    }

    if (p.arms && p.arms.length >= 2) {
      p.arms[0].rotation.x = -swing * 0.5;
      p.arms[1].rotation.x = swing * 0.5;
    }
  }

  updateBallControl(dt) {
    const ball = this.app.ball;

    if (!ball) return;

    const distance = this.player.root.position.distanceTo(
      ball.position
    );

    if (
      distance <
      PLAYER_CONTROL_CONFIG.dribbleDistance &&
      ball.owner === this.player
    ) {
      const offset = this.direction.clone()
        .multiplyScalar(0.9);

      const target = this.player.root.position.clone()
        .add(offset);

      target.y = SETTINGS.ballRadius;

      ball.position.x = damp(
        ball.position.x,
        target.x,
        12,
        dt
      );

      ball.position.z = damp(
        ball.position.z,
        target.z,
        12,
        dt
      );
    }
  }

  updateActions(dt) {
    if (this.input.pass) {
      this.tryPass();
    }

    if (this.input.shoot) {
      this.tryShoot();
    }

    if (this.input.tackle) {
      this.tryTackle();
    }
  }

  tryPass() {
    if (this.kickCooldown > 0) return;

    const ball = this.app.ball;

    if (!ball || ball.owner !== this.player) return;

    const teammate = this.findBestTeammate();

    if (!teammate) return;

    const direction = teammate.position.clone()
      .sub(ball.position);

    direction.y = 0;

    direction.normalize();

    this.kickBall(
      direction,
      12,
      0.04
    );

    this.kickCooldown = 0.45;
  }

  tryShoot() {
    if (this.kickCooldown > 0) return;

    const ball = this.app.ball;

    if (!ball || ball.owner !== this.player) return;

    const teamId = this.player.teamId || "blue";

    const attackDirection =
      TEAM_CONFIG[teamId].attackSign;

    const direction = V3(
      -ball.position.x * 0.025,
      0,
      attackDirection
    );

    direction.normalize();

    this.kickBall(
      direction,
      23,
      0.15
    );

    this.kickCooldown = 0.9;

    if (this.app.matchRuntime) {
      this.app.matchRuntime.presentation.recordShot(
        teamId,
        true
      );
    }
  }

  tryTackle() {
    if (this.tackleCooldown > 0) return;

    const ball = this.app.ball;

    if (!ball || !ball.owner) return;

    if (ball.owner.teamId === this.player.teamId) {
      return;
    }

    const distance = this.player.root.position.distanceTo(
      ball.position
    );

    if (distance > PLAYER_CONTROL_CONFIG.tackleRange) {
      return;
    }

    const success = Math.random() < 0.62;

    this.tackleCooldown = 1;

    if (success) {
      if (typeof ball.setOwner === "function") {
        ball.setOwner(this.player);
      } else {
        ball.owner = this.player;
      }
    }
  }

  kickBall(direction, power, lift = 0.04) {
    const ball = this.app.ball;

    if (!ball) return;

    if (typeof ball.kick === "function") {
      ball.kick(
        direction,
        power,
        lift
      );
    } else if (ball.velocity) {
      ball.velocity.x = direction.x * power;
      ball.velocity.y = lift * power;
      ball.velocity.z = direction.z * power;
      ball.owner = null;
    }
  }

  findBestTeammate() {
    const manager = this.app.teamManager;

    if (!manager) return null;

    const teammates = manager.getPlayers(
      this.player.teamId || "blue"
    );

    let best = null;
    let bestScore = -Infinity;

    for (const teammate of teammates) {
      if (teammate === this.player) continue;

      const distance = this.player.root.position.distanceTo(
        teammate.root.position
      );

      if (distance < 2 || distance > 16) continue;

      const score = 20 - distance;

      if (score > bestScore) {
        bestScore = score;
        best = teammate;
      }
    }

    return best;
  }

  dispose() {
    this.enabled = false;
    this.input.enabled = false;
  }
}

