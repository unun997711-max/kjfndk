const MATCH_CONFIG = Object.freeze({
  duration: 90 * 60,
  halfTime: 45 * 60,
  extraTime: 5 * 60,
  goalResetDelay: 2.2,
  kickoffDelay: 1.5,
  foulDistance: 1.15,
  offsideTolerance: 0.25,
  maxAddedTime: 5 * 60
});

class MatchClock {
  constructor() {
    this.time = 0;
    this.running = false;
    this.speed = 1;
    this.half = 1;
    this.addedTime = 0;
    this.finished = false;
  }

  start() {
    if (!this.finished) {
      this.running = true;
    }
  }

  pause() {
    this.running = false;
  }

  reset() {
    this.time = 0;
    this.running = false;
    this.half = 1;
    this.addedTime = 0;
    this.finished = false;
  }

  update(dt) {
    if (!this.running || this.finished) return;

    this.time += dt * this.speed;

    if (this.time >= MATCH_CONFIG.duration) {
      this.time = MATCH_CONFIG.duration;
      this.running = false;
      this.finished = true;
    }
  }

  getMinutes() {
    return Math.floor(this.time / 60);
  }

  getSeconds() {
    return Math.floor(this.time % 60);
  }

  getFormattedTime() {
    const minutes = String(this.getMinutes()).padStart(2, "0");
    const seconds = String(this.getSeconds()).padStart(2, "0");

    return `${minutes}:${seconds}`;
  }

  setSpeed(value) {
    this.speed = clamp(value, 0.25, 4);
  }
}

class MatchScore {
  constructor() {
    this.blue = 0;
    this.red = 0;

    this.events = [];
    this.scorers = {
      blue: [],
      red: []
    };
  }

  addGoal(teamId, playerName = "Unknown") {
    if (teamId === "blue") {
      this.blue++;
    } else if (teamId === "red") {
      this.red++;
    } else {
      return false;
    }

    this.scorers[teamId].push({
      player: playerName,
      time: Date.now()
    });

    this.events.push({
      type: "goal",
      team: teamId,
      player: playerName,
      timestamp: Date.now()
    });

    return true;
  }

  addEvent(type, teamId, details = {}) {
    this.events.push({
      type,
      team: teamId || null,
      details,
      timestamp: Date.now()
    });
  }

  getWinner() {
    if (this.blue > this.red) return "blue";
    if (this.red > this.blue) return "red";
    return "draw";
  }

  reset() {
    this.blue = 0;
    this.red = 0;

    this.events.length = 0;

    this.scorers.blue.length = 0;
    this.scorers.red.length = 0;
  }
}

class RefereeSystem {
  constructor() {
    this.fouls = [];
    this.cards = [];
    this.lastFoulTime = 0;
    this.enabled = true;
  }

  checkFoul(attacker, defender, clock) {
    if (!this.enabled || !attacker || !defender) {
      return null;
    }

    const distance = attacker.position.distanceTo(
      defender.position
    );

    if (distance > MATCH_CONFIG.foulDistance) {
      return null;
    }

    const now = clock.time;

    if (now - this.lastFoulTime < 4) {
      return null;
    }

    this.lastFoulTime = now;

    const foul = {
      type: "foul",
      attacker,
      defender,
      time: now
    };

    this.fouls.push(foul);

    return foul;
  }

  issueCard(player, color, clock) {
    if (!player) return null;

    const card = {
      player,
      color,
      time: clock.time
    };

    this.cards.push(card);

    return card;
  }

  getYellowCards(player) {
    return this.cards.filter(card =>
      card.player === player &&
      card.color === "yellow"
    ).length;
  }

  getRedCards(player) {
    return this.cards.filter(card =>
      card.player === player &&
      card.color === "red"
    ).length;
  }

  reset() {
    this.fouls.length = 0;
    this.cards.length = 0;
    this.lastFoulTime = 0;
  }
}

class OffsideSystem {
  constructor() {
    this.enabled = true;
    this.lastOffside = null;
  }

  checkPass(
    attackingPlayer,
    defenders,
    ballPosition,
    attackDirection
  ) {
    if (!this.enabled || !attackingPlayer) {
      return false;
    }

    const defenderPositions = defenders
      .filter(player => !player.isGoalkeeper)
      .map(player => player.position.z);

    if (defenderPositions.length < 2) {
      return false;
    }

    const sorted = defenderPositions.sort((a, b) => {
      return attackDirection > 0 ? b - a : a - b;
    });

    const secondLastDefender = sorted[1];

    const playerZ = attackingPlayer.position.z;
    const ballZ = ballPosition.z;

    let beyondDefender = false;
    let beyondBall = false;

    if (attackDirection > 0) {
      beyondDefender =
        playerZ > secondLastDefender +
        MATCH_CONFIG.offsideTolerance;

      beyondBall =
        playerZ > ballZ +
        MATCH_CONFIG.offsideTolerance;
    } else {
      beyondDefender =
        playerZ < secondLastDefender -
        MATCH_CONFIG.offsideTolerance;

      beyondBall =
        playerZ < ballZ -
        MATCH_CONFIG.offsideTolerance;
    }

    const offside = beyondDefender && beyondBall;

    if (offside) {
      this.lastOffside = {
        player: attackingPlayer,
        time: Date.now()
      };
    }

    return offside;
  }
}

/* ============================================================
   MATCH ENGINE
   ============================================================ */

class FootballMatchEngine {
  constructor(app) {
    this.app = app;

    this.clock = new MatchClock();
    this.score = new MatchScore();
    this.referee = new RefereeSystem();
    this.offside = new OffsideSystem();

    this.state = "ready";
    this.pendingReset = 0;

    this.kickoffTeam = "blue";
    this.lastGoalTeam = null;

    this.stats = {
      blue: {
        shots: 0,
        shotsOnTarget: 0,
        passes: 0,
        tackles: 0,
        possession: 0
      },

      red: {
        shots: 0,
        shotsOnTarget: 0,
        passes: 0,
        tackles: 0,
        possession: 0
      }
    };

    this.install();
  }

  install() {
    this.app.match = this;

    this.start();
  }

  start() {
    this.state = "playing";
    this.clock.start();
  }

  pause() {
    this.state = "paused";
    this.clock.pause();
  }

  resume() {
    if (this.state !== "finished") {
      this.state = "playing";
      this.clock.start();
    }
  }

  update(dt) {
    if (this.state !== "playing") return;

    this.clock.update(dt);

    if (this.pendingReset > 0) {
      this.pendingReset -= dt;

      if (this.pendingReset <= 0) {
        this.performKickoff();
      }

      return;
    }

    this.checkGoals();

    if (this.clock.finished) {
      this.finishMatch();
    }
  }

  checkGoals() {
    const ball = this.app.ball;

    if (!ball || !ball.position) return;

    const halfWidth = SETTINGS.goalWidth / 2;
    const halfLength = SETTINGS.fieldLength / 2;

    const insideGoal =
      Math.abs(ball.position.x) < halfWidth &&
      Math.abs(ball.position.y) < 2.6;

    if (!insideGoal) return;

    if (ball.position.z < -halfLength) {
      this.registerGoal("blue");
    } else if (ball.position.z > halfLength) {
      this.registerGoal("red");
    }
  }

  registerGoal(teamId) {
    if (this.state !== "playing") return;

    this.score.addGoal(
      teamId,
      this.app.ball.owner?.name || "Player"
    );

    this.lastGoalTeam = teamId;
    this.state = "goal";

    this.clock.pause();

    if (typeof this.app.ball.reset === "function") {
      this.app.ball.reset(
        V3(0, SETTINGS.ballRadius, 0)
      );
    }

    this.pendingReset = MATCH_CONFIG.goalResetDelay;

    if (this.app.teamAI) {
      this.app.teamAI.pause(true);
    }

    if (typeof this.app.onGoal === "function") {
      this.app.onGoal(teamId, this.score);
    }

    gameEvents?.emit?.("goal", {
      team: teamId,
      score: {
        blue: this.score.blue,
        red: this.score.red
      }
    });
  }

  performKickoff() {
    if (this.app.teamAI) {
      this.app.teamAI.reset();
      this.app.teamAI.pause(false);
    }

    if (this.app.ball?.reset) {
      this.app.ball.reset(
        V3(0, SETTINGS.ballRadius, 0)
      );
    }

    this.state = "playing";
    this.clock.start();
  }

  finishMatch() {
    this.state = "finished";
    this.clock.pause();

    if (this.app.teamAI) {
      this.app.teamAI.pause(true);
    }

    this.score.addEvent(
      "match-finished",
      null,
      {
        winner: this.score.getWinner()
      }
    );

    if (typeof this.app.onMatchFinished === "function") {
      this.app.onMatchFinished(
        this.score.getWinner(),
        this.score
      );
    }
  }

  resetMatch() {
    this.clock.reset();
    this.score.reset();
    this.referee.reset();

    this.stats.blue = {
      shots: 0,
      shotsOnTarget: 0,
      passes: 0,
      tackles: 0,
      possession: 0
    };

    this.stats.red = {
      shots: 0,
      shotsOnTarget: 0,
      passes: 0,
      tackles: 0,
      possession: 0
    };

    this.pendingReset = 0;
    this.state = "ready";

    this.performKickoff();
  }

  getResult() {
    return {
      blue: this.score.blue,
      red: this.score.red,
      winner: this.score.getWinner(),
      time: this.clock.getFormattedTime()
    };
  }
}

