   END OF PART 4 — FIRST SECTION
   ============================================================ */
/* ============================================================
   PART 4/5 — MOBILE TOUCH CONTROLS
   VIRTUAL JOYSTICK AND ACTION BUTTONS
   ============================================================ */

class VirtualJoystick {
  constructor(container, input) {
    this.container = container;
    this.input = input;

    this.active = false;
    this.pointerId = null;

    this.centerX = 0;
    this.centerY = 0;

    this.maxRadius = 48;

    this.x = 0;
    this.y = 0;

    this.create();
  }

  create() {
    if (!this.container) return;

    const base = document.createElement("div");

    Object.assign(base.style, {
      width: "130px",
      height: "130px",
      borderRadius: "50%",
      background: "rgba(255,255,255,0.13)",
      border: "2px solid rgba(255,255,255,0.3)",
      position: "relative",
      touchAction: "none",
      userSelect: "none"
    });

    const knob = document.createElement("div");

    Object.assign(knob.style, {
      width: "54px",
      height: "54px",
      borderRadius: "50%",
      background: "rgba(255,255,255,0.75)",
      border: "2px solid white",
      position: "absolute",
      left: "50%",
      top: "50%",
      transform: "translate(-50%,-50%)",
      boxShadow: "0 3px 12px rgba(0,0,0,0.35)"
    });

    base.appendChild(knob);

    this.base = base;
    this.knob = knob;

    this.container.appendChild(base);

    base.addEventListener(
      "pointerdown",
      event => this.onStart(event)
    );

    base.addEventListener(
      "pointermove",
      event => this.onMove(event)
    );

    base.addEventListener(
      "pointerup",
      event => this.onEnd(event)
    );

    base.addEventListener(
      "pointercancel",
      event => this.onEnd(event)
    );
  }

  onStart(event) {
    event.preventDefault();

    this.active = true;
    this.pointerId = event.pointerId;

    this.base.setPointerCapture(event.pointerId);

    const rect = this.base.getBoundingClientRect();

    this.centerX = rect.left + rect.width / 2;
    this.centerY = rect.top + rect.height / 2;

    this.onMove(event);
  }

  onMove(event) {
    if (!this.active) return;

    if (event.pointerId !== this.pointerId) return;

    const dx = event.clientX - this.centerX;
    const dy = event.clientY - this.centerY;

    const distance = Math.hypot(dx, dy);

    const scale = distance > this.maxRadius
      ? this.maxRadius / distance
      : 1;

    this.x = dx * scale;
    this.y = dy * scale;

    this.input.axisX =
      this.x / this.maxRadius;

    this.input.axisZ =
      this.y / this.maxRadius;

    this.knob.style.left =
      `calc(50% + ${this.x}px)`;

    this.knob.style.top =
      `calc(50% + ${this.y}px)`;
  }

  onEnd(event) {
    if (event.pointerId !== this.pointerId) return;

    this.active = false;
    this.pointerId = null;

    this.x = 0;
    this.y = 0;

    this.input.axisX = 0;
    this.input.axisZ = 0;

    this.knob.style.left = "50%";
    this.knob.style.top = "50%";
  }

  dispose() {
    if (this.base) {
      this.base.remove();
    }
  }
}

/* ============================================================
   MOBILE ACTION BUTTON
   ============================================================ */

class MobileActionButton {
  constructor(container, label, callback, options = {}) {
    this.container = container;
    this.label = label;
    this.callback = callback;

    this.options = options;

    this.pressed = false;

    this.create();
  }

  create() {
    const button = document.createElement("button");

    button.type = "button";
    button.textContent = this.label;

    const size = this.options.size || 66;

    Object.assign(button.style, {
      width: `${size}px`,
      height: `${size}px`,
      borderRadius: "50%",
      border: "2px solid rgba(255,255,255,0.8)",
      background:
        this.options.color || "rgba(25,100,190,0.85)",
      color: "#fff",
      fontWeight: "900",
      fontSize: "12px",
      touchAction: "none",
      userSelect: "none",
      boxShadow: "0 4px 10px rgba(0,0,0,0.3)"
    });

    const press = event => {
      event.preventDefault();

      this.pressed = true;

      button.style.transform = "scale(0.9)";
      button.style.filter = "brightness(1.3)";

      this.callback(true);
    };

    const release = event => {
      event.preventDefault();

      this.pressed = false;

      button.style.transform = "scale(1)";
      button.style.filter = "none";

      this.callback(false);
    };

    button.addEventListener("pointerdown", press);
    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("pointerleave", event => {
      if (this.pressed) release(event);
    });

    this.container.appendChild(button);

    this.element = button;
  }

  dispose() {
    if (this.element) {
      this.element.remove();
    }
  }
}

/* ============================================================
   MOBILE CONTROL LAYOUT
   ============================================================ */

class MobileControlSystem {
  constructor(controller) {
    this.controller = controller;

    this.root = null;
    this.joystick = null;

    this.buttons = [];

    this.create();
  }

  create() {
    if (typeof document === "undefined") return;

    const root = document.createElement("div");

    root.id = "football-mobile-controls";

    Object.assign(root.style, {
      position: "fixed",
      inset: "0",
      zIndex: "1002",
      pointerEvents: "none",
      userSelect: "none"
    });

    const left = document.createElement("div");

    Object.assign(left.style, {
      position: "absolute",
      left: "20px",
      bottom: "28px",
      pointerEvents: "auto"
    });

    const right = document.createElement("div");

    Object.assign(right.style, {
      position: "absolute",
      right: "18px",
      bottom: "25px",
      display: "grid",
      gridTemplateColumns: "repeat(2, 70px)",
      gap: "10px",
      pointerEvents: "auto",
      alignItems: "center"
    });

    root.append(left, right);

    document.body.appendChild(root);

    this.root = root;

    this.joystick = new VirtualJoystick(
      left,
      this.controller.input
    );

    this.createButtons(right);
  }

  createButtons(container) {
    const input = this.controller.input;

    this.addButton(
      container,
      "PASS",
      pressed => input.pass = pressed,
      "#1976d2"
    );

    this.addButton(
      container,
      "SHOOT",
      pressed => input.shoot = pressed,
      "#d32f2f"
    );

    this.addButton(
      container,
      "SPRINT",
      pressed => input.sprint = pressed,
      "#388e3c"
    );

    this.addButton(
      container,
      "TACKLE",
      pressed => input.tackle = pressed,
      "#ef6c00"
    );

    this.addButton(
      container,
      "SWITCH",
      pressed => {
        if (pressed) {
          this.controller.switchPlayer();
        }
      },
      "#6a1b9a"
    );
  }

  addButton(container, label, callback, color) {
    const button = new MobileActionButton(
      container,
      label,
      callback,
      {
        color,
        size: 66
      }
    );

    this.buttons.push(button);
  }

  setVisible(value) {
    if (this.root) {
      this.root.style.display =
        value ? "block" : "none";
    }
  }

  dispose() {
    if (this.joystick) {
      this.joystick.dispose();
    }

    for (const button of this.buttons) {
      button.dispose();
    }

    this.buttons.length = 0;

    if (this.root) {
      this.root.remove();
      this.root = null;
    }
  }
}

/* ============================================================
   PLAYER SWITCHING SYSTEM
   ============================================================ */

class PlayerSwitchSystem {
  constructor(app, controller) {
    this.app = app;
    this.controller = controller;

    this.currentIndex = 0;
  }

  getTeamPlayers() {
    if (!this.app.teamManager) return [];

    return this.app.teamManager.getPlayers(
      this.controller.player.teamId || "blue"
    );
  }

  switchToNearest() {
    const players = this.getTeamPlayers();

    if (!players.length) return null;

    const ballPosition = this.app.ball.position;

    let nearest = null;
    let nearestDistance = Infinity;

    for (const player of players) {
      if (player.isGoalkeeper) continue;

      const distance = player.root.position.distanceTo(
        ballPosition
      );

      if (distance < nearestDistance) {
        nearestDistance = distance;
        nearest = player;
      }
    }

    if (nearest) {
      this.controller.setPlayer(nearest);
    }

    return nearest;
  }

  switchNext() {
    const players = this.getTeamPlayers()
      .filter(player => !player.isGoalkeeper);

    if (!players.length) return null;

    this.currentIndex =
      (this.currentIndex + 1) % players.length;

    const selected = players[this.currentIndex];

    this.controller.setPlayer(selected);

    return selected;
  }
}

/* ============================================================
   EXTEND HUMAN PLAYER CONTROLLER
   ============================================================ */

HumanPlayerController.prototype.setPlayer = function(player) {
  if (!player) return;

  this.player = player;
};

HumanPlayerController.prototype.switchPlayer = function() {
  if (!this.switchSystem) return;

  this.switchSystem.switchNext();
};

HumanPlayerController.prototype.installMobileControls = function() {
  if (this.mobileControls) return this.mobileControls;

  this.switchSystem = new PlayerSwitchSystem(
    this.app,
    this
  );

  this.mobileControls = new MobileControlSystem(
    this
  );

  return this.mobileControls;
};

HumanPlayerController.prototype.disposeMobileControls = function() {
  if (this.mobileControls) {
    this.mobileControls.dispose();
    this.mobileControls = null;
  }
};

