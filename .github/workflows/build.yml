class TeamRosterManager {
  constructor(scene, playerFactory, ball) {
    this.scene = scene;
    this.playerFactory = playerFactory;
    this.ball = ball;

    this.teams = {
      blue: [],
      red: []
    };

    this.controllers = {
      blue: [],
      red: []
    };

    this.formations = {
      blue: new FormationSystem(TEAM_CONFIG.blue),
      red: new FormationSystem(TEAM_CONFIG.red)
    };

    this.createTeams();
  }

  createTeams() {
    this.createTeam("blue");
    this.createTeam("red");
  }

  createTeam(teamId) {
    const config = TEAM_CONFIG[teamId];

    config.formation.forEach((slot, index) => {
      const position = V3(
        slot.x,
        0,
        slot.z
      );

      const player = this.playerFactory.createPlayer(
        config.color,
        index + 1,
        position
      );

      player.teamId = teamId;
      player.role = slot.role;
      player.isGoalkeeper = slot.role === "GK";

      const controller = new TeamPlayerAI(
        player,
        teamId,
        slot,
        index
      );

      this.teams[teamId].push(player);
      this.controllers[teamId].push(controller);
    });
  }

  getPlayers(teamId) {
    return this.teams[teamId] || [];
  }

  getControllers(teamId) {
    return this.controllers[teamId] || [];
  }

  getAllPlayers() {
    return [
      ...this.teams.blue,
      ...this.teams.red
    ];
  }

  update(dt) {
    const ballPosition = this.ball.position;

    const possessionTeam = this.getPossessionTeam();

    const blueSlots = this.formations.blue.update(
      ballPosition,
      possessionTeam
    );

    const redSlots = this.formations.red.update(
      ballPosition,
      possessionTeam
    );

    this.updateTeam(
      "blue",
      blueSlots,
      possessionTeam,
      dt
    );

    this.updateTeam(
      "red",
      redSlots,
      possessionTeam,
      dt
    );
  }

  updateTeam(teamId, slots, possessionTeam, dt) {
    const controllers = this.controllers[teamId];

    const opponents = this.controllers[
      teamId === "blue" ? "red" : "blue"
    ];

    const context = {
      ball: this.ball,
      formation: this.formations[teamId],
      teamPlayers: controllers,
      opponentPlayers: opponents,
      possessionTeam,
      kickBall: this.kickBall.bind(this)
    };

    for (const controller of controllers) {
      controller.update(context, dt);
    }
  }

  kickBall(player, direction, power, lift = 0.035) {
    if (!this.ball) return;

    if (typeof this.ball.kick === "function") {
      this.ball.kick(
        direction,
        power,
        lift
      );
      return;
    }

    if (this.ball.velocity) {
      this.ball.velocity.x = direction.x * power;
      this.ball.velocity.y = lift * power;
      this.ball.velocity.z = direction.z * power;
      this.ball.owner = null;
    }
  }

  getPossessionTeam() {
    const owner = this.ball.owner;

    if (!owner) return null;

    return owner.teamId || null;
  }

  resetPositions() {
    for (const teamId of ["blue", "red"]) {
      const controllers = this.controllers[teamId];
      const formation = TEAM_CONFIG[teamId].formation;

      controllers.forEach((controller, index) => {
        controller.resetPosition(formation[index]);
      });

      this.formations[teamId].reset();
    }
  }

  dispose() {
    for (const player of this.getAllPlayers()) {
      if (player.root && player.root.parent) {
        player.root.parent.remove(player.root);
      }
    }

    this.teams.blue.length = 0;
    this.teams.red.length = 0;

    this.controllers.blue.length = 0;
    this.controllers.red.length = 0;
  }
}

class TeamAIIntegration {
  constructor(app) {
    this.app = app;

    this.roster = new TeamRosterManager(
      app.scene,
      app.playerFactory,
      app.ball
    );

    this.enabled = true;
    this.difficulty = 1;

    this.previousUpdate = app.update
      ? app.update.bind(app)
      : null;

    this.install();
  }

  install() {
    const integration = this;

    if (typeof this.previousUpdate === "function") {
      this.app.update = function updateWithAI(dt) {
        integration.previousUpdate(dt);

        if (integration.enabled) {
          integration.updateAI(dt);
        }
      };
    }

    this.app.teamAI = this;
    this.app.teamManager = this.roster;
  }

  updateAI(dt) {
    if (!this.app.ball) return;

    this.roster.update(dt);
  }

  setDifficulty(level) {
    this.difficulty = clamp(level, 0, 2);

    const multiplier = [
      0.78,
      1,
      1.2
    ][this.difficulty];

    for (const teamId of ["blue", "red"]) {
      for (const controller of this.roster.getControllers(teamId)) {
        controller.aggression = clamp(
          controller.aggression * multiplier,
          0.5,
          1.5
        );

        controller.passingSkill = clamp(
          controller.passingSkill * multiplier,
          0.5,
          1.5
        );

        controller.shootingSkill = clamp(
          controller.shootingSkill * multiplier,
          0.5,
          1.5
        );
      }
    }
  }

  pause(value = true) {
    this.enabled = !value;
  }

  reset() {
    this.roster.resetPositions();

    if (this.app.ball && typeof this.app.ball.reset === "function") {
      this.app.ball.reset(
        V3(0, SETTINGS.ballRadius, 0)
      );
    }
  }

  getTeam(teamId) {
    return this.roster.getPlayers(teamId);
  }

  dispose() {
    this.enabled = false;
    this.roster.dispose();
  }
}

/* ============================================================
   INSTALLATION
   ============================================================ */

// يتم تركيب نظام الفرق بعد إنشاء التطبيق والملعب والكرة.

function installTeamAI(app) {
  if (!app || !app.scene || !app.ball || !app.playerFactory) {
    console.error(
      "Team AI installation failed: missing app dependencies."
    );

    return null;
  }

  if (app.teamAI) {
    return app.teamAI;
  }

  try {
    const teamAI = new TeamAIIntegration(app);

    app.teamAI = teamAI;

    console.log(
      "Football AI installed successfully.",
      {
        bluePlayers: teamAI.getTeam("blue").length,
        redPlayers: teamAI.getTeam("red").length,
        totalPlayers:
          teamAI.getTeam("blue").length +
          teamAI.getTeam("red").length
      }
    );

    return teamAI;
  } catch (error) {
    console.error(
      "Team AI installation error:",
      error
    );

    return null;
  }
}

