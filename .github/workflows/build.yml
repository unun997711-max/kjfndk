class FormationSystem {
  constructor(teamConfig) {
    this.config = teamConfig;

    this.base = teamConfig.formation.map(slot => ({
      role: slot.role,
      x: slot.x,
      z: slot.z
    }));

    this.dynamic = this.base.map(slot => ({ ...slot }));
    this.ballInfluence = 0.34;
    this.attackSpread = 1;
    this.defensiveDepth = 1;
  }

  update(ballPosition, possessionTeam) {
    const attacking = possessionTeam === this.config.id;
    const sign = this.config.attackSign;

    this.dynamic = this.base.map((slot, index) => {
      const role = slot.role;
      const isKeeper = role === "GK";

      const lateralPull = clamp(
        ballPosition.x * 0.22,
        -4.2,
        4.2
      );

      const longitudinalPull = clamp(
        ballPosition.z * sign * this.ballInfluence,
        -5.5,
        5.5
      );

      let x = slot.x + lateralPull;
      let z = slot.z;

      if (!isKeeper) {
        z += attacking ? sign * 3.2 : -sign * 2.0;
        z += longitudinalPull;
      }

      if (role === "ST" && attacking) {
        z += sign * 2.5;
      }

      if (role === "CB" && !attacking) {
        z -= sign * 1.3;
      }

      if (isKeeper) {
        x = clamp(ballPosition.x * 0.28, -2.2, 2.2);
        z = sign < 0 ? 21.5 : -21.5;
      }

      return {
        role,
        x: clamp(x, -13.2, 13.2),
        z: clamp(z, -22.5, 22.5),
        index
      };
    });

    return this.dynamic;
  }

  getSlot(index) {
    return this.dynamic[index] || this.base[index];
  }

  reset() {
    this.dynamic = this.base.map(slot => ({ ...slot }));
  }
}

class TeamPlayerAI {
  constructor(player, teamId, slot, index) {
    this.player = player;
    this.teamId = teamId;
    this.slot = slot;
    this.index = index;
    this.role = slot.role;

    this.state = "formation";
    this.target = V3(slot.x, 0, slot.z);

    this.thinkTimer = rand(0, AI_TUNING.thinkInterval);
    this.actionTimer = rand(0, 0.4);
    this.tackleTimer = 0;
    this.kickTimer = 0;

    this.stamina = rand(75, 100);
    this.aggression = rand(0.78, 1.12);
    this.composure = rand(0.72, 1.1);
    this.passingSkill = rand(0.7, 1);
    this.shootingSkill = rand(0.65, 1);

    this.markTarget = null;
    this.isGoalkeeper = this.role === "GK";
    this.lastDecision = "formation";
  }

  get position() {
    return this.player.root.position;
  }

  setState(state) {
    if (this.state === state) return;

    this.state = state;
    this.lastDecision = state;
  }

  moveToward(target, dt, speedScale = 1) {
    const p = this.player;
    const delta = target.clone().sub(p.root.position);

    delta.y = 0;

    const distance = delta.length();

    if (distance < 0.08) {
      p.velocity.x = damp(p.velocity.x, 0, 10, dt);
      p.velocity.z = damp(p.velocity.z, 0, 10, dt);
      return;
    }

    delta.normalize();

    const desiredSpeed = SETTINGS.walkSpeed * speedScale;

    p.velocity.x = damp(
      p.velocity.x,
      delta.x * desiredSpeed,
      SETTINGS.acceleration * 0.72,
      dt
    );

    p.velocity.z = damp(
      p.velocity.z,
      delta.z * desiredSpeed,
      SETTINGS.acceleration * 0.72,
      dt
    );

    p.root.position.x += p.velocity.x * dt;
    p.root.position.z += p.velocity.z * dt;

    p.root.position.x = clamp(
      p.root.position.x,
      -SETTINGS.fieldWidth / 2 + 0.8,
      SETTINGS.fieldWidth / 2 - 0.8
    );

    p.root.position.z = clamp(
      p.root.position.z,
      -SETTINGS.fieldLength / 2 + 0.8,
      SETTINGS.fieldLength / 2 - 0.8
    );

    const yaw = Math.atan2(-delta.x, -delta.z);

    p.root.rotation.y = dampAngle(
      p.root.rotation.y,
      yaw,
      8,
      dt
    );

    p.direction.set(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );

    this.animate(dt, distance);
  }

  animate(dt, distance) {
    const p = this.player;

    const speed = Math.hypot(
      p.velocity.x,
      p.velocity.z
    );

    p.animationTime += dt * (speed > 2 ? 10 : 2);

    const swing = Math.sin(p.animationTime) *
      Math.min(0.62, speed * 0.09);

    p.legs[0].rotation.x = swing;
    p.legs[1].rotation.x = -swing;

    p.arms[0].rotation.x = -swing * 0.5;
    p.arms[1].rotation.x = swing * 0.5;
  }

  updateTimers(dt) {
    this.thinkTimer -= dt;
    this.actionTimer -= dt;

    this.tackleTimer = Math.max(
      0,
      this.tackleTimer - dt
    );

    this.kickTimer = Math.max(
      0,
      this.kickTimer - dt
    );

    this.stamina = Math.min(
      100,
      this.stamina + AI_TUNING.staminaRecovery * dt
    );
  }

  update(context, dt) {
    this.updateTimers(dt);

    if (this.isGoalkeeper) {
      this.updateGoalkeeper(context, dt);
      return;
    }

    if (this.thinkTimer <= 0) {
      this.think(context);

      this.thinkTimer =
        AI_TUNING.thinkInterval * rand(0.8, 1.25);
    }

    this.execute(context, dt);
  }

  think(context) {
    const {
      ball,
      formation,
      opponentPlayers,
      possessionTeam
    } = context;

    const distance = this.position.distanceTo(
      ball.position
    );

    const hasPossession = ball.owner === this.player;

    const teamHasPossession =
      possessionTeam === this.teamId;

    const nearestOpponent = this.findNearest(
      opponentPlayers,
      this.position
    );

    // يقرر اللاعب هل يضغط على الكرة أو يرجع للتشكيلة.
    if (!teamHasPossession && distance < 12) {
      this.setState("press");
      this.target.copy(ball.position);
      return;
    }

    // اللاعب الذي يملك الكرة يبحث عن فرصة تمرير أو تسديد.
    if (hasPossession) {
      this.setState("possess");
      this.target.copy(ball.position);
      return;
    }

    // عند امتلاك الفريق للكرة، يتحرك اللاعب لفتح مساحة.
    if (teamHasPossession) {
      this.setState("support");

      const side = this.index % 2 === 0 ? -1 : 1;

      this.target.set(
        clamp(
          ball.position.x + side * AI_TUNING.supportDistance,
          -13,
          13
        ),
        0,
        clamp(
          ball.position.z +
            TEAM_CONFIG[this.teamId].attackSign * 5,
          -22,
          22
        )
      );

      return;
    }

    // إذا كان المنافس قريباً، يحاول اللاعب مراقبته.
    if (nearestOpponent &&
        this.position.distanceTo(nearestOpponent.position) < 9) {
      this.setState("mark");
      this.markTarget = nearestOpponent;
      return;
    }

    // العودة إلى موقع اللاعب الأصلي في التشكيلة.
    this.setState("formation");

    const slot = formation.getSlot(this.index);

    this.target.set(
      slot.x,
      0,
      slot.z
    );
  }

  findNearest(players, position) {
    let nearest = null;
    let nearestDistance = Infinity;

    for (const item of players) {
      const distance = position.distanceTo(
        item.position
      );

      if (distance < nearestDistance) {
        nearestDistance = distance;
        nearest = item;
      }
    }

    return nearest;
  }
