class FormationSystem {
  constructor(teamConfig) {
    this.config = teamConfig;

    this.base = teamConfig.formation.map(slot => ({
      role: slot.role,
      x: slot.x,
      z: slot.z
    }));

    this.dynamic = this.base.map(slot => ({ ...slot }));
    this.ballInfluence = 0.34;
    this.attackSpread = 1;
    this.defensiveDepth = 1;
  }

  update(ballPosition, possessionTeam) {
    const attacking = possessionTeam === this.config.id;
    const sign = this.config.attackSign;

    this.dynamic = this.base.map((slot, index) => {
      const role = slot.role;
      const isKeeper = role === "GK";

      const lateralPull = clamp(
        ballPosition.x * 0.22,
        -4.2,
        4.2
      );

      const longitudinalPull = clamp(
        ballPosition.z * sign * this.ballInfluence,
        -5.5,
        5.5
      );

      let x = slot.x + lateralPull;
      let z = slot.z;

      if (!isKeeper) {
        z += attacking ? sign * 3.2 : -sign * 2.0;
        z += longitudinalPull;
      }

      if (role === "ST" && attacking) {
        z += sign * 2.5;
      }

      if (role === "CB" && !attacking) {
        z -= sign * 1.3;
      }

      if (isKeeper) {
        x = clamp(ballPosition.x * 0.28, -2.2, 2.2);
        z = sign < 0 ? 21.5 : -21.5;
      }

      return {
        role,
        x: clamp(x, -13.2, 13.2),
        z: clamp(z, -22.5, 22.5),
        index
      };
    });

    return this.dynamic;
  }

  getSlot(index) {
    return this.dynamic[index] || this.base[index];
  }

  reset() {
    this.dynamic = this.base.map(slot => ({ ...slot }));
  }
}

