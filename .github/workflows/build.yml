/* ================= AUDIO MANAGER ================= */

class FootballAudioManager {
  constructor() {
    this.context = null;
    this.masterGain = null;
    this.enabled = true;
    this.volume = 0.5;
  }

  initialize() {
    if (this.context) return;

    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    this.context = new AudioContextClass();

    this.masterGain = this.context.createGain();
    this.masterGain.gain.value = this.volume;

    this.masterGain.connect(this.context.destination);
  }

  setVolume(value) {
    this.volume = clamp(value, 0, 1);

    if (this.masterGain) {
      this.masterGain.gain.value =
        this.enabled ? this.volume : 0;
    }
  }

  setEnabled(value) {
    this.enabled = Boolean(value);

    if (this.masterGain) {
      this.masterGain.gain.value =
        this.enabled ? this.volume : 0;
    }
  }

  playTone(frequency, duration = 0.15, type = "sine") {
    if (!this.enabled) return;

    this.initialize();

    if (!this.context || !this.masterGain) return;

    if (this.context.state === "suspended") {
      this.context.resume();
    }

    const oscillator = this.context.createOscillator();
    const gain = this.context.createGain();

    oscillator.type = type;
    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(
      0.0001,
      this.context.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.2,
      this.context.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      this.context.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(this.masterGain);

    oscillator.start();
    oscillator.stop(
      this.context.currentTime + duration
    );
  }

  playKick() {
    this.playTone(130, 0.12, "triangle");
  }

  playGoal() {
    this.playTone(520, 0.25, "sine");

    setTimeout(() => {
      this.playTone(660, 0.3, "sine");
    }, 180);

    setTimeout(() => {
      this.playTone(780, 0.4, "sine");
    }, 400);
  }

  dispose() {
    if (this.context) {
      this.context.close();
      this.context = null;
    }
  }
}

/* ================= MAIN MENU ================= */

class FootballMainMenu {
  constructor(app) {
    this.app = app;

    this.audio = new FootballAudioManager();

    this.root = null;
    this.paused = false;

    this.create();
  }

  create() {
    if (typeof document === "undefined") return;

    const root = document.createElement("div");

    root.id = "football-main-menu";

    Object.assign(root.style, {
      position: "fixed",
      inset: "0",
      zIndex: "2000",
      display: "flex",
      alignItems: "center",
      justifyContent: "center",
      background:
        "linear-gradient(135deg, rgba(3,25,48,.96), rgba(8,75,65,.94))",
      color: "white",
      fontFamily: "Arial, sans-serif",
      textAlign: "center"
    });

    const panel = document.createElement("div");

    Object.assign(panel.style, {
      width: "min(90%, 430px)",
      padding: "30px",
      borderRadius: "22px",
      background: "rgba(0,0,0,.38)",
      border: "1px solid rgba(255,255,255,.2)",
      boxShadow: "0 15px 50px rgba(0,0,0,.4)"
    });

    const heading = document.createElement("h1");

    heading.textContent = "FOOTBALL 3D";

    Object.assign(heading.style, {
      fontSize: "38px",
      letterSpacing: "3px",
      marginBottom: "8px"
    });

    const subtitle = document.createElement("p");

    subtitle.textContent = "3D Football Experience";

    subtitle.style.opacity = "0.75";

    panel.append(heading, subtitle);

    this.addButton(panel, "START MATCH", () => {
      this.startMatch();
    });

    this.addButton(panel, "RESUME", () => {
      this.resumeMatch();
    });

    this.addButton(panel, "SOUND: ON", button => {
      this.audio.setEnabled(!this.audio.enabled);

      button.textContent = this.audio.enabled
        ? "SOUND: ON"
        : "SOUND: OFF";
    });

    const volumeLabel = document.createElement("label");

    volumeLabel.textContent = "VOLUME";

    Object.assign(volumeLabel.style, {
      display: "block",
      marginTop: "18px"
    });

    const volume = document.createElement("input");

    volume.type = "range";
    volume.min = "0";
    volume.max = "1";
    volume.step = "0.05";
    volume.value = String(this.audio.volume);

    volume.style.width = "100%";

    volume.addEventListener("input", () => {
      this.audio.setVolume(Number(volume.value));
    });

    panel.append(volumeLabel, volume);

    root.appendChild(panel);
    document.body.appendChild(root);

    this.root = root;
  }

  addButton(parent, label, callback) {
    const button = document.createElement("button");

    button.textContent = label;

    Object.assign(button.style, {
      display: "block",
      width: "100%",
      padding: "14px",
      marginTop: "12px",
      border: "0",
      borderRadius: "10px",
      background: "#16864b",
      color: "white",
      fontSize: "16px",
      fontWeight: "bold",
      cursor: "pointer"
    });

    button.addEventListener("click", () => {
      this.audio.initialize();
      callback(button);
    });

    parent.appendChild(button);

    return button;
  }

  startMatch() {
    this.audio.initialize();

    this.paused = false;

    if (this.app.matchRuntime) {
      this.app.matchRuntime.start();
    }

    this.hide();
  }

  pauseMatch() {
    this.paused = true;

    if (this.app.matchRuntime) {
      this.app.matchRuntime.pause();
    }

    this.show();
  }

  resumeMatch() {
    this.paused = false;

    if (this.app.matchRuntime) {
      this.app.matchRuntime.resume();
    }

    this.hide();
  }

  show() {
    if (this.root) {
      this.root.style.display = "flex";
    }
  }

  hide() {
    if (this.root) {
      this.root.style.display = "none";
    }
  }

  dispose() {
    this.audio.dispose();

    if (this.root) {
      this.root.remove();
      this.root = null;
    }
  }
}

/* ================= PAUSE BUTTON ================= */

function installPauseButton(app) {
  if (typeof document === "undefined") return null;

  const button = document.createElement("button");

  button.textContent = "Ⅱ";

  Object.assign(button.style, {
    position: "fixed",
    top: "18px",
    right: "18px",
    zIndex: "1500",
    width: "48px",
    height: "48px",
    borderRadius: "50%",
    border: "2px solid white",
    background: "rgba(0,0,0,.6)",
    color: "white",
    fontSize: "22px",
    cursor: "pointer"
  });

  button.addEventListener("click", () => {
    if (app.mainMenu) {
      app.mainMenu.pauseMatch();
    }
  });

  document.body.appendChild(button);

  return button;
}

/* ================= INSTALL MENU ================= */

function installFootballMenu(app) {
  if (!app) return null;

  if (app.mainMenu) {
    app.mainMenu.dispose();
  }

  app.mainMenu = new FootballMainMenu(app);

  app.pauseButton = installPauseButton(app);

  return app.mainMenu;
}

