/* ============================================================
   PART 3/5 — MATCH HUD AND STATISTICS
   ============================================================ */

class MatchStatistics {
  constructor() {
    this.data = {
      blue: this.createTeamStats(),
      red: this.createTeamStats()
    };

    this.possessionTimer = {
      blue: 0,
      red: 0
    };
  }

  createTeamStats() {
    return {
      shots: 0,
      shotsOnTarget: 0,
      goals: 0,
      passes: 0,
      completedPasses: 0,
      tackles: 0,
      fouls: 0,
      corners: 0,
      saves: 0,
      yellowCards: 0,
      redCards: 0
    };
  }

  add(teamId, statistic, amount = 1) {
    if (!this.data[teamId]) return;

    if (!(statistic in this.data[teamId])) return;

    this.data[teamId][statistic] += amount;
  }

  updatePossession(teamId, dt) {
    if (!this.possessionTimer[teamId]) return;

    this.possessionTimer[teamId] += dt;
  }

  getPossession() {
    const blue = this.possessionTimer.blue;
    const red = this.possessionTimer.red;

    const total = blue + red;

    if (total <= 0) {
      return {
        blue: 50,
        red: 50
      };
    }

    return {
      blue: Math.round((blue / total) * 100),
      red: Math.round((red / total) * 100)
    };
  }

  getTeamStats(teamId) {
    return {
      ...this.data[teamId]
    };
  }

  reset() {
    this.data.blue = this.createTeamStats();
    this.data.red = this.createTeamStats();

    this.possessionTimer.blue = 0;
    this.possessionTimer.red = 0;
  }
}

/* ============================================================
   MATCH EVENT FEED
   ============================================================ */

class MatchEventFeed {
  constructor(maxEvents = 8) {
    this.maxEvents = maxEvents;
    this.events = [];
  }

  push(type, message, time = "") {
    this.events.unshift({
      type,
      message,
      time,
      createdAt: Date.now()
    });

    if (this.events.length > this.maxEvents) {
      this.events.length = this.maxEvents;
    }
  }

  goal(team, player, time) {
    this.push(
      "goal",
      `GOAL! ${player} scored for ${team.toUpperCase()}`,
      time
    );
  }

  foul(player, time) {
    this.push(
      "foul",
      `Foul committed by ${player}`,
      time
    );
  }

  card(player, color, time) {
    this.push(
      "card",
      `${color.toUpperCase()} CARD: ${player}`,
      time
    );
  }

  pass(player, time) {
    this.push(
      "pass",
      `${player} made a pass`,
      time
    );
  }

  getLatest(count = 5) {
    return this.events.slice(0, count);
  }

  clear() {
    this.events.length = 0;
  }
}

/* ============================================================
   MATCH HUD
   ============================================================ */

class MatchHUD {
  constructor(match) {
    this.match = match;

    this.root = null;
    this.scoreElement = null;
    this.clockElement = null;
    this.statusElement = null;
    this.eventsElement = null;

    this.visible = true;

    this.create();
  }

  create() {
    if (typeof document === "undefined") return;

    const root = document.createElement("div");

    root.id = "football-match-hud";

    Object.assign(root.style, {
      position: "fixed",
      top: "14px",
      left: "50%",
      transform: "translateX(-50%)",
      zIndex: "1000",
      width: "min(440px, 94vw)",
      color: "#ffffff",
      fontFamily: "Arial, sans-serif",
      pointerEvents: "none"
    });

    const panel = document.createElement("div");

    Object.assign(panel.style, {
      background: "rgba(8, 15, 27, 0.88)",
      border: "1px solid rgba(255,255,255,0.2)",
      borderRadius: "15px",
      padding: "12px 18px",
      boxShadow: "0 5px 25px rgba(0,0,0,0.4)"
    });

    const teams = document.createElement("div");

    Object.assign(teams.style, {
      display: "flex",
      justifyContent: "space-between",
      alignItems: "center",
      gap: "10px"
    });

    this.blueLabel = this.createLabel("BLUE");
    this.redLabel = this.createLabel("RED");

    this.scoreElement = document.createElement("div");

    Object.assign(this.scoreElement.style, {
      fontSize: "30px",
      fontWeight: "900",
      letterSpacing: "3px",
      textAlign: "center"
    });

    teams.append(
      this.blueLabel,
      this.scoreElement,
      this.redLabel
    );

    this.clockElement = document.createElement("div");

    Object.assign(this.clockElement.style, {
      textAlign: "center",
      fontSize: "13px",
      marginTop: "8px",
      color: "#d5e8ff",
      fontWeight: "bold"
    });

    this.statusElement = document.createElement("div");

    Object.assign(this.statusElement.style, {
      textAlign: "center",
      marginTop: "5px",
      fontSize: "11px",
      color: "#a8d7ff"
    });

    this.eventsElement = document.createElement("div");

    Object.assign(this.eventsElement.style, {
      marginTop: "8px",
      fontSize: "11px",
      textAlign: "center",
      color: "#ffe49b"
    });

    panel.append(
      teams,
      this.clockElement,
      this.statusElement,
      this.eventsElement
    );

    root.appendChild(panel);

    document.body.appendChild(root);

    this.root = root;

    this.update();
  }

  createLabel(text) {
    const element = document.createElement("div");

    element.textContent = text;

    Object.assign(element.style, {
      fontWeight: "bold",
      fontSize: "12px",
      letterSpacing: "1px"
    });

    return element;
  }

  update() {
    if (!this.root || !this.match) return;

    const match = this.match;

    this.scoreElement.textContent =
      `${match.score.blue} - ${match.score.red}`;

    this.clockElement.textContent =
      `TIME ${match.clock.getFormattedTime()}`;

    this.statusElement.textContent =
      match.state.toUpperCase();

    this.blueLabel.style.color = "#55aaff";
    this.redLabel.style.color = "#ff6666";

    if (match.state === "goal") {
      this.eventsElement.textContent = "GOAL!";
    } else if (match.state === "finished") {
      this.eventsElement.textContent =
        `WINNER: ${match.score.getWinner().toUpperCase()}`;
    } else {
      this.eventsElement.textContent = "";
    }
  }

  setVisible(value) {
    this.visible = Boolean(value);

    if (this.root) {
      this.root.style.display =
        this.visible ? "block" : "none";
    }
  }

  dispose() {
    if (this.root) {
      this.root.remove();
      this.root = null;
    }
  }
}

/* ============================================================
   REFEREE WHISTLE SYSTEM
   ============================================================ */

class RefereeAudio {
  constructor() {
    this.context = null;
    this.enabled = true;
  }

  initialize() {
    if (this.context) return;

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContextClass) return;

    this.context = new AudioContextClass();
  }

  whistle(duration = 0.25) {
    if (!this.enabled) return;

    this.initialize();

    if (!this.context) return;

    const oscillator =
      this.context.createOscillator();

    const gain =
      this.context.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 2300;

    gain.gain.setValueAtTime(
      0.0001,
      this.context.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.12,
      this.context.currentTime + 0.025
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      this.context.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(this.context.destination);

    oscillator.start();

    oscillator.stop(
      this.context.currentTime + duration
    );
  }

  setEnabled(value) {
    this.enabled = Boolean(value);
  }

  dispose() {
    if (this.context) {
      this.context.close();
      this.context = null;
    }
  }
}

/* ============================================================
   MATCH PRESENTATION CONTROLLER
   ============================================================ */

class MatchPresentation {
  constructor(match) {
    this.match = match;

    this.statistics = new MatchStatistics();
    this.feed = new MatchEventFeed();

    this.hud = new MatchHUD(match);
    this.audio = new RefereeAudio();

    this.updateTimer = 0;

    this.bindEvents();
  }

  bindEvents() {
    this.match.presentation = this;

    const originalGoal =
      this.match.registerGoal.bind(this.match);

    this.match.registerGoal = (teamId) => {
      const previousScore = {
        blue: this.match.score.blue,
        red: this.match.score.red
      };

      originalGoal(teamId);

      if (
        this.match.score.blue !== previousScore.blue ||
        this.match.score.red !== previousScore.red
      ) {
        this.statistics.add(teamId, "goals");

        this.feed.goal(
          teamId,
          "Player",
          this.match.clock.getFormattedTime()
        );

        this.audio.whistle(0.4);
      }
    };

    const originalFinish =
      this.match.finishMatch.bind(this.match);

    this.match.finishMatch = () => {
      originalFinish();

      this.audio.whistle(0.8);
      this.hud.update();
    };
  }

  update(dt) {
    this.updateTimer += dt;

    if (this.updateTimer >= 0.1) {
      this.updateTimer = 0;

      this.hud.update();
    }
  }

  recordShot(teamId, onTarget = false) {
    this.statistics.add(teamId, "shots");

    if (onTarget) {
      this.statistics.add(
        teamId,
        "shotsOnTarget"
      );
    }
  }

  recordPass(teamId, completed = true) {
    this.statistics.add(teamId, "passes");

    if (completed) {
      this.statistics.add(
        teamId,
        "completedPasses"
      );
    }
  }

  recordTackle(teamId) {
    this.statistics.add(teamId, "tackles");
  }

  recordFoul(teamId) {
    this.statistics.add(teamId, "fouls");
  }

  getReport() {
    return {
      result: this.match.getResult(),

      statistics: {
        blue: this.statistics.getTeamStats("blue"),
        red: this.statistics.getTeamStats("red")
      },

      possession: this.statistics.getPossession(),

      events: this.feed.getLatest(8)
    };
  }

  dispose() {
    this.hud.dispose();
    this.audio.dispose();
  }
}

