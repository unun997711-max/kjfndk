/* ============================================================
   PART 5/5 — GRAPHICS AND VISUAL EFFECTS
   ============================================================ */

class StadiumGraphics {
  constructor(app) {
    this.app = app;
    this.scene = app.scene;

    this.effects = [];
    this.createLighting();
    this.createAtmosphere();
  }

  createLighting() {
    const ambient = new THREE.HemisphereLight(
      0xffffff,
      0x496044,
      1.15
    );

    this.scene.add(ambient);

    const sun = new THREE.DirectionalLight(
      0xffffff,
      1.7
    );

    sun.position.set(-15, 25, 10);
    sun.castShadow = true;

    sun.shadow.mapSize.set(2048, 2048);

    sun.shadow.camera.left = -35;
    sun.shadow.camera.right = 35;
    sun.shadow.camera.top = 35;
    sun.shadow.camera.bottom = -35;

    this.scene.add(sun);

    this.sun = sun;
  }

  createAtmosphere() {
    this.scene.background = new THREE.Color(0x87bce8);

    this.scene.fog = new THREE.Fog(
      0x87bce8,
      65,
      150
    );
  }

  createGoalEffect(position) {
    const geometry = new THREE.RingGeometry(
      0.4,
      1.8,
      32
    );

    const material = new THREE.MeshBasicMaterial({
      color: 0xffdd55,
      transparent: true,
      opacity: 0.9,
      side: THREE.DoubleSide
    });

    const ring = new THREE.Mesh(
      geometry,
      material
    );

    ring.position.copy(position);
    ring.position.y += 0.5;

    this.scene.add(ring);

    this.effects.push({
      object: ring,
      life: 1.2,
      maxLife: 1.2,
      type: "goal"
    });
  }

  update(deltaTime) {
    for (let i = this.effects.length - 1; i >= 0; i--) {
      const effect = this.effects[i];

      effect.life -= deltaTime;

      if (effect.type === "goal") {
        const progress =
          1 - effect.life / effect.maxLife;

        effect.object.scale.setScalar(
          1 + progress * 2
        );

        effect.object.material.opacity =
          Math.max(0, effect.life / effect.maxLife);
      }

      if (effect.life <= 0) {
        this.scene.remove(effect.object);

        effect.object.geometry.dispose();
        effect.object.material.dispose();

        this.effects.splice(i, 1);
      }
    }
  }

  dispose() {
    for (const effect of this.effects) {
      this.scene.remove(effect.object);
      effect.object.geometry.dispose();
      effect.object.material.dispose();
    }

    this.effects.length = 0;
  }
}

/* ============================================================
   BALL TRAIL EFFECT
   ============================================================ */

class BallTrailEffect {
  constructor(app) {
    this.app = app;
    this.scene = app.scene;

    this.points = [];
    this.maxPoints = 12;

    this.geometry = new THREE.BufferGeometry();

    const positions = new Float32Array(
      this.maxPoints * 3
    );

    this.geometry.setAttribute(
      "position",
      new THREE.BufferAttribute(positions, 3)
    );

    this.material = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.35
    });

    this.line = new THREE.Line(
      this.geometry,
      this.material
    );

    this.scene.add(this.line);
  }

  update() {
    if (!this.app.ball) return;

    const position = this.app.ball.position;

    this.points.push(position.clone());

    if (this.points.length > this.maxPoints) {
      this.points.shift();
    }

    const attribute =
      this.geometry.attributes.position;

    for (let i = 0; i < this.maxPoints; i++) {
      const point = this.points[i];

      if (point) {
        attribute.setXYZ(
          i,
          point.x,
          point.y,
          point.z
        );
      } else {
        attribute.setXYZ(i, 0, -100, 0);
      }
    }

    attribute.needsUpdate = true;

    this.geometry.setDrawRange(
      0,
      this.points.length
    );
  }

  dispose() {
    this.scene.remove(this.line);

    this.geometry.dispose();
    this.material.dispose();

    this.points.length = 0;
  }
}

/* ============================================================
   FOOTBALL GRAPHICS INSTALLER
   ============================================================ */

function installStadiumGraphics(app) {
  if (!app || !app.scene) {
    console.error("App scene is missing.");
    return null;
  }

  if (app.stadiumGraphics) {
    return app.stadiumGraphics;
  }

  const graphics = new StadiumGraphics(app);
  const trail = new BallTrailEffect(app);

  app.stadiumGraphics = graphics;
  app.ballTrail = trail;

  return graphics;
}

