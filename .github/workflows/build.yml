          class BallController {
            constructor(scene) {
              this.scene = scene;
              this.radius = SETTINGS.ballRadius;
              this.velocity = V3();
              this.angularVelocity = V3();
              this.position = V3(0, this.radius, 0);
              this.owner = null;
              this.lastTouchTeam = null;
              this.mesh = this.createMesh();
            }
          
            createMesh() {
              const group = new THREE.Group();
          
              const sphere = new THREE.Mesh(
                new THREE.SphereGeometry(this.radius, 24, 18),
                MaterialFactory.standard(COLORS.ball, 0.38, 0.02)
              );
              sphere.castShadow = true;
              group.add(sphere);
          
              const patchMaterial = new THREE.MeshStandardMaterial({
                color: 0x17202a,
                roughness: 0.62
              });
          
              for (let i = 0; i < 5; i++) {
                const patch = new THREE.Mesh(
                  new THREE.CircleGeometry(this.radius * 0.28, 5),
                  patchMaterial
                );
                patch.position.set(
                  Math.sin(i * Math.PI * 0.4) * this.radius * 0.88,
                  Math.cos(i * Math.PI * 0.4) * this.radius * 0.88,
                  this.radius * 0.46
                );
                patch.lookAt(
                  patch.position.clone().multiplyScalar(2)
                );
                group.add(patch);
              }
          
              group.position.copy(this.position);
              this.scene.add(group);
              return group;
            }
          
            reset(position = V3()) {
              this.position.copy(position);
              this.position.y = this.radius;
              this.velocity.set(0, 0, 0);
              this.angularVelocity.set(0, 0, 0);
              this.owner = null;
              this.mesh.position.copy(this.position);
            }
          
            kick(direction, power, lift = 0.08) {
              const dir = direction.clone().normalize();
              this.owner = null;
              this.velocity.x = dir.x * power;
              this.velocity.z = dir.z * power;
              this.velocity.y = Math.max(0, lift * power);
              this.lastTouchTeam = "blue";
            }
          
            update(dt) {
              if (this.owner) {
                const forward = this.owner.direction.clone();
                const target = this.owner.root.position.clone()
                  .add(forward.multiplyScalar(0.62));
                target.y = this.radius;
                this.position.lerp(target, 1 - Math.exp(-18 * dt));
                this.velocity.set(0, 0, 0);
              } else {
                this.velocity.y -= SETTINGS.gravity * dt;
                this.position.addScaledVector(this.velocity, dt);
          
                if (this.position.y < this.radius) {
                  this.position.y = this.radius;
                  if (this.velocity.y < -1.1) this.velocity.y *= -0.28;
                  else this.velocity.y = 0;
                  this.velocity.x *= Math.pow(0.985, dt * 60);
                  this.velocity.z *= Math.pow(0.985, dt * 60);
                }
          
                this.position.x = clamp(
                  this.position.x,
                  -SETTINGS.fieldWidth / 2 + this.radius,
                  SETTINGS.fieldWidth / 2 - this.radius
                );
          
                this.position.z = clamp(
                  this.position.z,
                  -SETTINGS.fieldLength / 2 - 1.5,
                  SETTINGS.fieldLength / 2 + 1.5
                );
          
                this.velocity.x *= Math.pow(0.992, dt * 60);
                this.velocity.z *= Math.pow(0.992, dt * 60);
          
                this.mesh.rotation.x += this.velocity.z * dt / this.radius;
                this.mesh.rotation.z -= this.velocity.x * dt / this.radius;
              }
          
              this.mesh.position.copy(this.position);
            }
          }
          
          class PlayerController {
            constructor(player, input, ball) {
              this.player = player;
              this.input = input;
              this.ball = ball;
              this.kickCooldown = 0;
              this.stamina = 100;
            }
          
            update(dt, cameraYaw = 0) {
              const p = this.player;
              const axis = this.input.axis;
              const forward = V3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
              const right = V3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
          
              const desired = V3()
                .addScaledVector(right, axis.x)
                .addScaledVector(forward, axis.y);
          
              if (desired.lengthSq() > 1) desired.normalize();
          
              const running = this.input.sprint && this.stamina > 1;
              const maxSpeed = running ? SETTINGS.sprintSpeed : SETTINGS.walkSpeed;
          
              if (running && desired.lengthSq() > 0.01) {
                this.stamina = Math.max(0, this.stamina - 17 * dt);
              } else {
                this.stamina = Math.min(100, this.stamina + 9 * dt);
              }
          
              p.velocity.x = damp(
                p.velocity.x,
                desired.x * maxSpeed,
                SETTINGS.acceleration,
                dt
              );
          
              p.velocity.z = damp(
                p.velocity.z,
                desired.z * maxSpeed,
                SETTINGS.acceleration,
                dt
              );
          
              p.root.position.x += p.velocity.x * dt;
              p.root.position.z += p.velocity.z * dt;
          
              p.root.position.x = clamp(
                p.root.position.x,
                -SETTINGS.fieldWidth / 2 + 0.8,
                SETTINGS.fieldWidth / 2 - 0.8
              );
          
              p.root.position.z = clamp(
                p.root.position.z,
                -SETTINGS.fieldLength / 2 + 0.8,
                SETTINGS.fieldLength / 2 - 0.8
              );
          
              const speed = Math.hypot(p.velocity.x, p.velocity.z);
              if (speed > 0.15) {
                const targetYaw = Math.atan2(
                  -p.velocity.x,
                  -p.velocity.z
                );
                p.root.rotation.y = dampAngle(
                  p.root.rotation.y,
                  targetYaw,
                  12,
                  dt
                );
                p.direction.set(
                  Math.sin(targetYaw),
                  0,
                  Math.cos(targetYaw)
                ).negate();
              }
          
              this.animate(dt, speed, running);
              this.kickCooldown = Math.max(0, this.kickCooldown - dt);
          
              if (this.input.consumeShoot()) this.shoot();
              if (this.input.consumePass()) this.pass();
            }
          
            animate(dt, speed, running) {
              const p = this.player;
              p.animationTime += dt * (running ? 12 : 8) * (speed > 0.1 ? 1 : 0.15);
              const swing = Math.sin(p.animationTime) * Math.min(0.75, speed * 0.12);
              p.legs[0].rotation.x = swing;
              p.legs[1].rotation.x = -swing;
              p.arms[0].rotation.x = -swing * 0.65;
              p.arms[1].rotation.x = swing * 0.65;
              p.root.position.y = Math.abs(Math.sin(p.animationTime * 2)) *
                Math.min(0.035, speed * 0.004);
            }
          
            shoot() {
              if (this.kickCooldown > 0) return;
              const p = this.player;
              const distance = p.root.position.distanceTo(this.ball.position);
              if (distance > 1.65 && this.ball.owner !== p) return;
          
              this.ball.owner = null;
              const direction = p.direction.clone();
              direction.y = 0.08;
              direction.normalize();
              this.ball.kick(direction, 15.5, 0.2);
              this.kickCooldown = 0.45;
            }
          
            pass() {
              if (this.kickCooldown > 0) return;
              const p = this.player;
              if (p.root.position.distanceTo(this.ball.position) > 1.65 &&
                  this.ball.owner !== p) return;
          
              this.ball.owner = null;
              this.ball.kick(p.direction, 8.5, 0.035);
              this.kickCooldown = 0.3;
            }
          }
          
          function dampAngle(current, target, speed, dt) {
            const difference = Math.atan2(
              Math.sin(target - current),
              Math.cos(target - current)
            );
            return current + difference * (1 - Math.exp(-speed * dt));
          }
          
          class FollowCamera {
            constructor(camera, target) {
              this.camera = camera;
              this.target = target;
              this.yaw = 0;
              this.offset = V3(0, SETTINGS.cameraHeight, SETTINGS.cameraDistance);
              this.lookOffset = V3(0, 1.1, 0);
