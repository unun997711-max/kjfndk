/* ============================================================
   PART 5/5 — FINAL MATCH SCREEN
   ============================================================ */

class FootballEndScreen {
  constructor(app) {
    this.app = app;
    this.root = null;
  }

  create() {
    if (this.root) return;

    const root = document.createElement("div");

    Object.assign(root.style, {
      position: "fixed",
      inset: "0",
      zIndex: "3000",
      display: "none",
      alignItems: "center",
      justifyContent: "center",
      background: "rgba(0,0,0,0.88)",
      color: "white",
      fontFamily: "Arial",
      textAlign: "center"
    });

    const panel = document.createElement("div");

    Object.assign(panel.style, {
      width: "min(90%, 460px)",
      padding: "30px",
      borderRadius: "18px",
      background: "#123d2b",
      boxShadow: "0 10px 40px rgba(0,0,0,.5)"
    });

    this.heading = document.createElement("h1");
    this.heading.textContent = "FULL TIME";

    this.score = document.createElement("h2");

    Object.assign(this.score.style, {
      fontSize: "48px",
      margin: "20px"
    });

    this.stats = document.createElement("div");

    panel.append(
      this.heading,
      this.score,
      this.stats
    );

    this.addButton(panel, "PLAY AGAIN", () => {
      this.hide();

      if (this.app.matchRuntime) {
        this.app.matchRuntime.start();
      }
    });

    this.addButton(panel, "MAIN MENU", () => {
      this.hide();

      if (this.app.mainMenu) {
        this.app.mainMenu.show();
      }
    });

    root.appendChild(panel);
    document.body.appendChild(root);

    this.root = root;
  }

  addButton(parent, label, callback) {
    const button = document.createElement("button");

    button.textContent = label;

    Object.assign(button.style, {
      display: "block",
      width: "100%",
      padding: "13px",
      marginTop: "12px",
      border: "none",
      borderRadius: "8px",
      background: "#20a45b",
      color: "white",
      fontWeight: "bold",
      fontSize: "15px"
    });

    button.addEventListener("click", callback);

    parent.appendChild(button);
  }

  show(homeScore, awayScore, statistics = {}) {
    this.create();

    this.score.textContent =
      `${homeScore} - ${awayScore}`;

    this.stats.replaceChildren();

    for (const [name, value] of Object.entries(statistics)) {
      const line = document.createElement("p");

      line.textContent = `${name}: ${value}`;

      this.stats.appendChild(line);
    }

    this.root.style.display = "flex";
  }

  hide() {
    if (this.root) {
      this.root.style.display = "none";
    }
  }

  dispose() {
    if (this.root) {
      this.root.remove();
      this.root = null;
    }
  }
}

/* ============================================================
   MATCH SYSTEM INTEGRATION
   ============================================================ */

function installFootballFinalSystems(app) {
  if (!app || !app.scene) {
    console.error("Cannot initialize football systems.");
    return null;
  }

  app.endScreen = new FootballEndScreen(app);

  if (!app.stadiumGraphics) {
    installStadiumGraphics(app);
  }

  if (!app.mainMenu) {
    installFootballMenu(app);
  }

  app.finalSystemsInstalled = true;

  return app;
}

/* ============================================================
   MATCH RESULT HELPERS
   ============================================================ */

function showFootballFinalResult(app) {
  if (!app || !app.endScreen || !app.matchScore) {
    console.warn("Match result systems are not ready.");
    return;
  }

  const homeScore =
    app.matchScore.homeScore ?? 0;

  const awayScore =
    app.matchScore.awayScore ?? 0;

  const statistics = {};

  if (app.matchStatistics) {
    statistics["Shots"] =
      app.matchStatistics.totalShots ?? 0;

    statistics["Possession"] =
      `${app.matchStatistics.possession ?? 50}%`;
  }

  app.endScreen.show(
    homeScore,
    awayScore,
    statistics
  );
}

/* ============================================================
   CLEANUP
   ============================================================ */

function disposeFootballGameSystems(app) {
  if (!app) return;

  if (app.humanControllerManager) {
    app.humanControllerManager.dispose();
  }

  if (app.stadiumGraphics) {
    app.stadiumGraphics.dispose();
  }

  if (app.ballTrail) {
    app.ballTrail.dispose();
  }

  if (app.mainMenu) {
    app.mainMenu.dispose();
  }

  if (app.endScreen) {
    app.endScreen.dispose();
  }

  if (app.pauseButton) {
    app.pauseButton.remove();
    app.pauseButton = null;
  }

  app.finalSystemsInstalled = false;
}

/* ============================================================
   COMPLETE PROJECT INSTALLER
   ============================================================ */

function installCompleteFootballExperience(app, player) {
  if (!app) {
    throw new Error("Football app is required.");
  }

  installFootballFinalSystems(app);

  if (player) {
    initializeHumanFootballMode(app, player);
  }

  if (!app.__graphicsUpdateConnected) {
    const previousUpdate = app.update;

    app.update = function(deltaTime) {
      if (typeof previousUpdate === "function") {
        previousUpdate.call(this, deltaTime);
      }

      if (this.stadiumGraphics) {
        this.stadiumGraphics.update(deltaTime);
      }

      if (this.ballTrail) {
        this.ballTrail.update();
      }
    };

    app.__graphicsUpdateConnected = true;
  }

  return app;
}

